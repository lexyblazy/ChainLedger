services:
  db:
    image: postgres:16.2-alpine
    container_name: chainledger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - chainledger_net

  migrate:
    image: migrate/migrate:4
    container_name: chainledger_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend/migrations:/migrations

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    networks:
      - chainledger_net

  api:
    build: ./backend
    container_name: chainledger_api
    restart: unless-stopped
    command: ["./app", "api"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - chainledger_net
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build: ./backend
    container_name: chainledger_worker
    restart: unless-stopped
    command: ["./app", "worker"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - chainledger_net

  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: chainledger_frontend
    restart: unless-stopped
    env_file:
      - .env

    depends_on:
      - api
    networks:
      - chainledger_net
    ports:
      - "127.0.0.1:3000:3000"
  
