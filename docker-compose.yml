services:
  db:
    image: postgres:16.2-alpine
    container_name: polychain_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - polychain_net

  migrate:
    image: migrate/migrate:4
    container_name: polychain_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend/migrations:/migrations

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    networks:
      - polychain_net

  backend:
    build: ./backend
    container_name: polychain_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - polychain_net
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: polychain_frontend
    restart: unless-stopped
    env_file:
      - .env

    depends_on:
      - backend
    networks:
      - polychain_net
    ports:
      - "127.0.0.1:3000:3000"
  
  backup:
    image: postgres:16.2-alpine
    container_name: polychain_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: -c '
      while true; do
        echo "Running backup...";
        PGPASSWORD=$POSTGRES_PASSWORD pg_dump
          -h db
          -U $POSTGRES_USER
          -d $POSTGRES_DB
          -F c
          -f /backups/backup_$(date +%Y%m%d_%H%M%S).dump;
        echo "Backup complete.";
        find /backups -type f -mtime +7 -delete;
        sleep 86400;
      done'
    networks:
      - polychain_net


volumes:
  postgres_data:

networks:
  polychain_net:
    driver: bridge
